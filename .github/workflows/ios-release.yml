name: iOS Release

# Wiederverwendbarer Build-&-Upload-Baustein: archiviert, signiert (über match)
# und lädt zu TestFlight hoch. Setzt oder committet keine Version — Marketing-
# version und Build-Nummer kommen als fertige Werte vom Aufrufer (normalerweise
# ios-nightly.yml) und werden nur als Build-Parameter injiziert
# (MARKETING_VERSION / CURRENT_PROJECT_VERSION), nicht in project.pbxproj
# geschrieben. Dadurch bleibt main frei von automatisierten Commits außerhalb
# von Pull Requests.
#
# Direkter Aufruf (z. B. für einen manuellen Ad-hoc-Build) im App-Repo:
#
#   jobs:
#     release:
#       uses: bickelmeister/ios-platform/.github/workflows/ios-release.yml@v1
#       with:
#         project: diaro-ios.xcodeproj
#         scheme: diaro-ios
#         marketing-version: "1.4.0"
#         build-number: "42"
#       secrets: inherit
#
# In der Praxis ruft ios-nightly.yml diesen Workflow auf und übergibt
# Marketingversion und Build-Nummer automatisch. Details: docs/release.md.

on:
  workflow_call:
    inputs:
      project:
        description: "Xcode-Projektdatei, z. B. diaro-ios.xcodeproj"
        type: string
        required: true
      scheme:
        description: "Zu archivierendes Scheme"
        type: string
        required: true
      marketing-version:
        description: "CFBundleShortVersionString, z. B. 1.4.0"
        type: string
        required: true
      build-number:
        description: "CFBundleVersion, rein numerisch, z. B. 42"
        type: string
        required: true
      xcode-version:
        description: "Xcode-Version für setup-xcode, z. B. 16.1 oder latest-stable"
        type: string
        required: false
        default: latest-stable
      runs-on:
        type: string
        required: false
        default: macos-26
      environment:
        description: "GitHub Environment mit den Secrets/Protection Rules für diesen Upload"
        type: string
        required: false
        default: release
    secrets:
      ASC_KEY_ID:
        description: "App Store Connect API Key ID"
        required: true
      ASC_ISSUER_ID:
        description: "App Store Connect Issuer ID"
        required: true
      ASC_KEY_P8:
        description: "Base64-kodierter Inhalt der .p8-Datei"
        required: true
      MATCH_PASSWORD:
        description: "Passphrase des match-Repos"
        required: true
      MATCH_GIT_TOKEN:
        description: "PAT mit Lesezugriff auf bickelmeister/ios-certificates"
        required: true

permissions:
  contents: read

# Zwei gleichzeitige Uploads für dasselbe Projekt dürfen sich nicht in die Quere
# kommen (match/Keychain, TestFlight-Build-Nummern).
concurrency:
  group: ios-release-${{ github.repository }}-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & TestFlight
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Buildnummer validieren
        env:
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build-number muss rein numerisch sein, war '${BUILD_NUMBER}'."
            exit 1
          fi

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      # Ohne diese Prüfung stirbt fastlane erst im Archive-Job an einem
      # OpenSSL-Stacktrace ("invalid curve name"), der nicht verrät, dass
      # schlicht das Secret nicht stimmt.
      - name: Secrets vorab prüfen
        env:
          KEY_B64: ${{ secrets.ASC_KEY_P8 }}
          GIT_AUTH: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$KEY_B64" ]]; then
            echo "::error::ASC_KEY_P8 ist leer."
            exit 1
          fi
          if ! header=$(printf '%s' "$KEY_B64" | base64 --decode 2>/dev/null | head -1); then
            echo "::error::ASC_KEY_P8 ist kein gültiges base64. Erzeugen mit: base64 -i AuthKey_XXXX.p8 | gh secret set ASC_KEY_P8"
            exit 1
          fi
          if [[ "$header" != *"BEGIN PRIVATE KEY"* ]]; then
            echo "::error::ASC_KEY_P8 dekodiert nicht zu einem PEM-Schlüssel (erwartet '-----BEGIN PRIVATE KEY-----')."
            exit 1
          fi

          # match erwartet base64 von "benutzer:token", nicht den rohen Token.
          if ! decoded=$(printf '%s' "$GIT_AUTH" | base64 --decode 2>/dev/null) || [[ "$decoded" != *":"* ]]; then
            echo "::error::MATCH_GIT_TOKEN muss base64 von 'benutzer:token' sein. Erzeugen mit: echo -n \"user:pat\" | base64"
            exit 1
          fi

          echo "ASC_KEY_P8 und MATCH_GIT_TOKEN sehen plausibel aus."

      - name: Ruby und fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build und Upload nach TestFlight
        env:
          SCHEME: ${{ inputs.scheme }}
          PROJECT: ${{ inputs.project }}
          MARKETING_VERSION: ${{ inputs.marketing-version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "true"
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_TOKEN }}
          # match legt sonst einen interaktiven Keychain-Prompt an.
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          CI: "true"
        run: bundle exec fastlane release

      # Nachvollziehbarkeit: welches Binary wurde für welche Build-Nummer
      # tatsächlich hochgeladen. dSYMs werden für die Crash-Symbolisierung im
      # Xcode Organizer gebraucht.
      - name: Build-Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scheme }}-build-${{ inputs.build-number }}
          path: |
            build/*.ipa
            build/*.dSYM.zip
          retention-days: 90
          if-no-files-found: warn
