name: Trunk-Tag

# Setzt ein trunkVersion-Tag, damit jeder Stand von main eine eindeutige,
# sortierbare Version hat — unabhängig von den SemVer-Releases.
#
# Läuft auf ubuntu (1-facher Minuten-Multiplikator) und braucht wenige Sekunden.
#
# Zwei Aufrufarten, je nachdem ob im App-Repo CI auf main läuft:
#
#   a) CI läuft auf main — an den CI-Lauf hängen, damit kein Tag auf einem
#      kaputten Commit landet:
#
#      on:
#        workflow_run:
#          workflows: [CI]
#          branches: [main]
#          types: [completed]
#
#   b) CI läuft nur auf Pull Requests (spart macOS-Minuten) — direkt auf den
#      Push nach main reagieren. Der Stand wurde dann im PR geprüft, nicht auf
#      main selbst; bei Squash-Merge ist das derselbe Baum, solange nicht
#      zwischendurch etwas anderes gelandet ist.
#
#      on:
#        push:
#          branches: [main]
#
#   jobs:
#     tag:
#       uses: bickelmeister/ios-platform/.github/workflows/ios-trunk-tag.yml@v1

on:
  workflow_call:

jobs:
  tag:
    name: trunkVersion taggen
    # Bei workflow_run kein Tag auf einem roten Lauf. Bei push gibt es nichts
    # zu prüfen, die Bedingung ist dann immer wahr.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Offizielles Tool für das TrunkVer-Schema (https://trunkver.org):
      # {UTC-Zeitstempel}.0.0-g{Source-Ref}-{Build-Ref}, erkennt GitHub Actions
      # automatisch und übernimmt Formatierung/Truncation.
      - name: trunkVersion generieren
        id: trunkver
        uses: crftd-tech/trunkver@fabb74fd3afac726d6352018bfca2f8dc5d3b764 # 1.1.3

      - name: trunkVersion taggen
        env:
          TRUNKVER: ${{ steps.trunkver.outputs.trunkver }}
        run: |
          set -euo pipefail
          echo "trunkVersion: $TRUNKVER"
          git tag "$TRUNKVER"
          git push origin "$TRUNKVER"
