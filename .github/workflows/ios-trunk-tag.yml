name: Trunk-Tag

# Setzt nach jedem grünen CI-Lauf auf main ein trunkVersion-Tag, damit jeder
# Stand von main eine eindeutige, sortierbare Version hat — unabhängig von den
# SemVer-Releases.
#
# Aufruf im App-Repo (.github/workflows/trunk-tag.yml):
#
#   on:
#     workflow_run:
#       workflows: [CI]
#       branches: [main]
#       types: [completed]
#
#   jobs:
#     tag:
#       uses: bickelmeister/ios-platform/.github/workflows/ios-trunk-tag.yml@v1

on:
  workflow_call:

jobs:
  tag:
    name: trunkVersion taggen
    # Kein Tag auf einem kaputten Commit.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Offizielles Tool für das TrunkVer-Schema (https://trunkver.org):
      # {UTC-Zeitstempel}.0.0-g{Source-Ref}-{Build-Ref}, erkennt GitHub Actions
      # automatisch und übernimmt Formatierung/Truncation.
      - name: trunkVersion generieren
        id: trunkver
        uses: crftd-tech/trunkver@fabb74fd3afac726d6352018bfca2f8dc5d3b764 # 1.1.3

      - name: trunkVersion taggen
        env:
          TRUNKVER: ${{ steps.trunkver.outputs.trunkver }}
        run: |
          set -euo pipefail
          echo "trunkVersion: $TRUNKVER"
          git tag "$TRUNKVER"
          git push origin "$TRUNKVER"
